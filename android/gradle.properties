# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ---------------------------------------------------------------------------
# Rendimiento del build
# ---------------------------------------------------------------------------

# Memoria del daemon de Gradle. El valor por defecto de RN (2048m) obliga al
# recolector de basura a trabajar constantemente en un proyecto de este tamano.
# 4 GB es seguro en una maquina con 16 GB. Si tienes 32 GB, sube a 6144m.
# Si ves "Java heap space" o el build se cuelga, baja este valor.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Compila modulos independientes en paralelo. Este proyecto tiene ~15 modulos
# nativos (notifee, reanimated, screens, mmkv...) que no dependen entre si.
org.gradle.parallel=true

# Cache de builds: reutiliza resultados de tareas ya ejecutadas, incluso tras
# un `clean`. Es lo que mas acelera el segundo build y los siguientes.
org.gradle.caching=true

# Mantiene el daemon vivo entre builds (evita pagar el arranque de la JVM).
org.gradle.daemon=true

# Compilacion incremental de Kotlin: solo recompila lo que cambio.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# R8 en modo completo: optimizacion mas agresiva que el modo compatibilidad.
android.enableR8.fullMode=true

# ---------------------------------------------------------------------------
# Configuracion de Android
# ---------------------------------------------------------------------------

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Arquitecturas nativas a compilar.
#
# Se elimino x86 (32 bits): no queda ningun dispositivo Android ni emulador
# moderno que lo use, y aportaba 53 MB al APK universal.
#
# Para el desarrollo diario NO edites esto: usa `npm run android:fast`, que
# detecta la arquitectura del dispositivo conectado y compila solo esa.
# Puntualmente tambien puedes forzarlo desde la CLI:
#   ./gradlew <task> -PreactNativeArchitectures=arm64-v8a
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false
